name: msvc

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/msvc.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/msvc.yml'
  workflow_dispatch:
  # Weekly, so the rows that float with the runner images and package archives ("newest",
  # apt.llvm.org, gcc:N) are rebuilt without a push.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  msvc:
    name: MSVC ${{ matrix.target.toolset || 'newest' }} ${{ matrix.config }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        target:
          # floor: VS 2019 16.11, UE 5.3
          - {os: windows-2022, toolset: '14.29', component: VC.14.29.16.11}
          # UBT minimums: UE 5.4, UE 5.5 to 5.7
          - {os: windows-2022, toolset: '14.34', component: VC.14.34.17.4}
          - {os: windows-2022, toolset: '14.38', component: VC.14.38.17.8}
          # VS 2022's newest
          - {os: windows-2022, toolset: '14.44'}
          # the image's newest
          - {os: windows-2025-vs2026}
    steps:
      - uses: actions/checkout@v4
      # Older toolsets (VS 2019's 14.29, VS 2022's earlier ones) are optional components of the
      # VS 2022 image.
      - if: matrix.target.component
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          Start-Process -Wait -NoNewWindow -FilePath "$installer\vs_installer.exe" -ArgumentList `
            "modify", "--installPath", "`"$vs`"", `
            "--add", "Microsoft.VisualStudio.Component.${{ matrix.target.component }}.x86.x64", `
            "--quiet", "--norestart", "--nocache"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.target.toolset }}
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=cl -DZR_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j 4
