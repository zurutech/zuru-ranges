name: msvc

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/msvc.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/msvc.yml'
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC ${{ matrix.target.toolset || 'newest' }} ${{ matrix.config }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        target:
          - {os: windows-2022, toolset: '14.29'}  # floor: VS 2019 16.11, UE 5.3
          - {os: windows-2022, toolset: '14.44'}  # UE 5.7
          - {os: windows-2025-vs2026}  # newest
    steps:
      - uses: actions/checkout@v4
      # The VS 2019 toolset is an optional component of the VS 2022 image.
      - if: matrix.target.toolset == '14.29'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          Start-Process -Wait -NoNewWindow -FilePath "$installer\vs_installer.exe" -ArgumentList `
            "modify", "--installPath", "`"$vs`"", "--add", "Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64", `
            "--quiet", "--norestart", "--nocache"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.target.toolset }}
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=cl -DZR_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j 4
