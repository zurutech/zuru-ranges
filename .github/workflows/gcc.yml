name: gcc

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/gcc.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/gcc.yml'
  workflow_dispatch:
  # Weekly, so the rows that float with the runner images and package archives ("newest",
  # apt.llvm.org, gcc:N) are rebuilt without a push.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  gcc:
    name: >-
      g++-${{ matrix.gcc }} C++${{ matrix.std }} ${{ matrix.config }}${{ matrix.hardened && ' hardened' || '' }}
      ${{ matrix.cmake && format('CMake {0}', matrix.cmake) || '' }}
    runs-on: ubuntu-latest
    container: gcc:${{ matrix.gcc }}
    strategy:
      fail-fast: false
      matrix:
        gcc: [11, 12, 13, 14, 15, 16]
        std: [20]
        config: [Debug]
        include:
          - {gcc: 11, std: 20, config: Release}
          - {gcc: 16, std: 20, config: Release}
          - {gcc: 16, std: 20, config: Release, hardened: '-H'}
          - {gcc: 16, std: 23, config: Debug}
          # the CMake floor (cmake_minimum_required); Release, so it adds a job rather than
          # merging into the original gcc 11 Debug one
          - {gcc: 11, std: 20, config: Release, cmake: '3.21.7'}
    steps:
      - uses: actions/checkout@v4
      - run: ci/install-cmake-ninja.sh
        env:
          ZR_CMAKE_VERSION: ${{ matrix.cmake }}
      - run: scripts/make.sh -c g++ -W --std ${{ matrix.std }} --config ${{ matrix.config }} ${{ matrix.hardened }}
