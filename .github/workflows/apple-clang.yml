name: apple-clang

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/apple-clang.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/apple-clang.yml'
  workflow_dispatch:
  # Weekly, so the rows that float with the runner images and package archives ("newest",
  # apt.llvm.org, gcc:N) are rebuilt without a push.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  apple-clang:
    name: Apple Clang (Xcode ${{ matrix.target.xcode || 'default' }}) ${{ matrix.config }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        target:
          # Xcode 15 (the library's floor, UE 5.5's minimum) is not built: macos-14, the last
          # image with it, was retired on 2026-11-02
          # UE 5.5's newest
          - {os: macos-15, xcode: '16.4'}
          - {os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target.xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.target.xcode }}.app
      - run: brew install ninja
      - run: /usr/bin/clang++ --version
      - run: scripts/make.sh -c /usr/bin/clang++ -W --config ${{ matrix.config }}
