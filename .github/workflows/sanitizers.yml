name: sanitizers

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/sanitizers.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'modules/**'
      - 'test/**'
      - 'cmake/**'
      - 'ci/**'
      - 'CMakeLists.txt'
      - 'scripts/make.sh'
      - '.github/workflows/sanitizers.yml'
  workflow_dispatch:
  # Weekly, so the rows that float with the runner images and package archives ("newest",
  # apt.llvm.org, gcc:N) are rebuilt without a push.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  sanitizers:
    name: ${{ matrix.name }} + ASan/UBSan
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # UE 5.7's Linux toolchain; libclang-rt: the sanitizer runtimes
          - {name: clang++-20 libc++, image: 'ubuntu:24.04', make: -c clang++-20 --libcxx,
             setup: ci/install-clang.sh 20 && apt-get install -y -qq --no-install-recommends libclang-rt-20-dev}
          - {name: g++-16, image: 'gcc:16', setup: ci/install-cmake-ninja.sh, make: -c g++}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.setup }}
      - run: scripts/make.sh ${{ matrix.make }} -W -s
